        <section>
          <h2>FAQ</h2>
          <dl>
            <dt>What is GEO (Generative Engine Optimization)?</dt>
            <dd>GEO is the practice of optimizing content so that AI systems like ChatGPT, Claude, and Gemini reference and cite your brand in their responses. It goes beyond traditional SEO by focusing on how AI models select and present information.</dd>
            <dt>How does HaloX track AI visibility?</dt>
            <dd>HaloX sends real prompts to multiple AI models and analyzes their responses to measure brand mentions, citations, sentiment, and ranking position. This provides actionable data on how AI perceives your brand.</dd>
            <dt>What is an AI Visibility Index (AVI)?</dt>
            <dd>AVI is a composite score (0-100) measuring how prominently your brand appears in AI-generated answers across multiple models and prompts. It factors in mention frequency, citation rate, sentiment, and position.</dd>
            <dt>What AI models does HaloX support?</dt>
            <dd>HaloX tracks responses from ChatGPT (GPT-4o), Claude (Anthropic), Gemini (Google), Perplexity, and more. The platform continuously adds support for new AI models.</dd>
            <dt>How is GEO different from SEO?</dt>
            <dd>SEO focuses on ranking in search engine results pages. GEO focuses on being cited and mentioned in AI-generated answers. While they share some principles, GEO requires specific optimizations like structured citations, conversational formatting, and entity-level optimization.</dd>
            <dt>What is a Site Audit in GEO context?</dt>
            <dd>A GEO site audit analyzes your website's readiness for AI crawlers. It checks structured data, content quality, citation potential, and technical factors that influence whether AI models can find, understand, and cite your content.</dd>
